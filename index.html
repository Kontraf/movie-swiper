<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090514">
    <title>🍿 Movie Swiper // Match Your Night</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #090514 100%) fixed;
            display: flex;
            flex-direction: column;
            /* dvh = ύψος που μετράει τη μπάρα του browser στο κινητό (το vh την αγνοεί και κόβει τα κουμπιά) */
            min-height: 100vh;
            min-height: 100dvh;
            padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px)
                     calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);
            overflow-x: hidden;
            overscroll-behavior: none;
            touch-action: manipulation; /* χωρίς καθυστέρηση και double-tap zoom στα κουμπιά */
            -webkit-tap-highlight-color: transparent;
        }

        /* Η κάρτα προσαρμόζεται στην οθόνη: δεν ξεπερνά το πλάτος και αφήνει χώρο για τα κουμπιά */
        .card-container {
            --card-h: min(500px, calc(100dvh - 255px), calc((100vw - 32px) * 1.5));
            position: relative;
            height: max(var(--card-h), 240px);
            width: calc(max(var(--card-h), 240px) / 1.5);
            perspective: 1000px;
        }

        .movie-card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform-origin: 50% 99%;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y; /* το οριζόντιο swipe το χειρίζεται ο κώδικας, το κάθετο scroll μένει στον browser */
        }

        .movie-card:active {
            cursor: grabbing;
        }

        /* Gradient overlay πάνω από την αφίσα για να διαβάζεται το κείμενο */
        #matches-panel { touch-action: pan-y; }
        #matches-list { overscroll-behavior: contain; }

        /* Σε οριζόντια θέση (χαμηλή οθόνη) τα κουμπιά πάνε δίπλα στην κάρτα */
        @media (orientation: landscape) and (max-height: 500px) {
            body { flex-direction: row; align-items: center; justify-content: center; gap: 24px; }
            body > header { display: none; }
            body > main { flex: 0 0 auto; padding-block: 0 !important; }
            body > .controls { flex: 0 0 auto; }
            .card-container { --card-h: calc(100dvh - 64px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
        }

        .card-overlay {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.4) 40%, transparent 100%);
        }
    </style>
</head>
<body class="text-white">

    <header class="text-center">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-400">🍿 MOVIE SWIPER</h1>
        <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Swipe right for YES, left for NO</p>
    </header>

    <main class="flex-1 min-h-0 flex items-center justify-center py-3">
        <div class="card-container" id="deck">
            <p id="deck-status" class="hidden text-center text-slate-400 p-6" role="status">Loading movies…</p>
            <div id="no-more-cards" class="hidden text-center p-6">
                <p class="text-xl font-bold mb-2">🎉 That's all for now!</p>
                <p class="text-sm text-slate-400 mb-4">That is the end of this round. Your watchlist is saved.</p>
                <button onclick="resetDeck()" class="bg-violet-600 hover:bg-violet-700 text-white font-bold py-2 px-6 rounded-full transition">
                    Show more movies
                </button>
            </div>
        </div>
    </main>

    <div class="controls flex flex-col items-center gap-2">
        <div class="flex justify-center gap-8">
            <button onclick="swipeButton('left')" aria-label="Skip this movie" class="w-16 h-16 rounded-full bg-slate-900/80 border border-red-500/30 flex items-center justify-center text-red-500 active:bg-red-500 active:text-white hover:bg-red-500 hover:text-white transition shadow-lg text-2xl">
                ✖
            </button>
            <button onclick="swipeButton('right')" aria-label="Save to watchlist" class="w-16 h-16 rounded-full bg-slate-900/80 border border-green-500/30 flex items-center justify-center text-green-400 active:bg-green-500 active:text-white hover:bg-green-500 hover:text-white transition shadow-lg text-2xl">
                ❤
            </button>
        </div>
        <button onclick="toggleMatches()" class="bg-violet-600 text-white font-semibold h-11 px-5 rounded-full text-sm shadow-lg active:bg-violet-700 hover:bg-violet-700 transition">
            📂 View Watchlist (<span id="match-count">0</span>)
        </button>
        <p id="source-note" class="text-center text-[10px] leading-tight text-slate-500 px-2"></p>
    </div>

    <div id="matches-panel" class="fixed left-1/2 -translate-x-1/2 w-[min(92vw,24rem)] bg-slate-950/95 border border-violet-500/30 rounded-xl p-4 shadow-2xl transition-all transform scale-0 origin-bottom z-20" style="bottom: calc(env(safe-area-inset-bottom) + 16px)">
        <h3 class="font-bold text-violet-400 border-b border-slate-800 pb-2 mb-2 flex justify-between items-center">
            <span>💚 Your Watchlist</span>
            <button onclick="toggleMatches()" class="text-sm text-slate-300 hover:text-white px-3 h-10 -mr-2">Close</button>
        </h3>
        <ul id="matches-list" class="max-h-[45dvh] overflow-y-auto space-y-2 text-sm text-slate-300">
            <li class="italic text-slate-500">No movies saved yet...</li>
        </ul>
    </div>


    <script>
        // Λίστα ταινιών. Κάθε γύρος διαλέγει τυχαία ταινίες από εδώ.
        const movieData = [
            {"id": 1, "title": "Dune: Part Two", "year": "2024", "genre": "Sci-Fi / Adventure", "desc": "Paul Atreides joins the Fremen and seeks revenge against those who destroyed his family."},
            {"id": 2, "title": "Oppenheimer", "year": "2023", "genre": "Biography / Drama", "desc": "The story of J. Robert Oppenheimer and the creation of the atomic bomb."},

            {"id": 9, "title": "Pulp Fiction", "year": "1994", "genre": "Crime / Drama", "desc": "Interwoven stories of hitmen, a boxer and a gangster's wife in Los Angeles."},
            {"id": 10, "title": "The Shawshank Redemption", "year": "1994", "genre": "Drama", "desc": "A banker wrongly convicted of murder forms a lasting friendship in prison."},
            {"id": 11, "title": "Forrest Gump", "year": "1994", "genre": "Drama / Romance", "desc": "A kind-hearted man unknowingly takes part in several decades of American history."},
            {"id": 12, "title": "Gladiator", "year": "2000", "genre": "Action / Drama", "desc": "A betrayed Roman general fights as a gladiator to avenge his family."},
            {"id": 13, "title": "Whiplash", "year": "2014", "genre": "Drama / Music", "desc": "A young drummer is pushed to his limits by an abusive instructor."},
            {"id": 14, "title": "La La Land", "year": "2016", "genre": "Musical / Romance", "desc": "A jazz pianist and an aspiring actress fall in love while chasing their dreams in Los Angeles."},
            {"id": 15, "title": "Mad Max: Fury Road", "year": "2015", "genre": "Action / Sci-Fi", "desc": "Furiosa and Max flee a tyrant across a desert wasteland."},

            {"id": 17, "title": "Joker", "year": "2019", "genre": "Crime / Drama", "desc": "A failed comedian in Gotham slowly turns into the Joker."},
            {"id": 18, "title": "The Godfather", "year": "1972", "genre": "Crime / Drama", "desc": "The aging head of a crime family hands control to his reluctant son."},
            {"id": 19, "title": "Fight Club", "year": "1999", "genre": "Drama / Thriller", "desc": "An insomniac office worker and a soap salesman start an underground fight club."},
            {"id": 20, "title": "Spirited Away", "year": "2001", "genre": "Animation / Fantasy", "desc": "A girl enters a world of spirits and must work to free her parents."},

            {"id": 23, "title": "The Lion King", "year": "1994", "genre": "Animation / Family", "desc": "A lion cub flees after his father's death and later returns to claim his kingdom."},
            {"id": 24, "title": "Avengers: Endgame", "year": "2019", "genre": "Action / Sci-Fi", "desc": "The Avengers assemble once more to undo the damage caused by Thanos."},
            {"id": 25, "title": "Top Gun: Maverick", "year": "2022", "genre": "Action / Drama", "desc": "Maverick trains a new generation of pilots for a dangerous mission."},
            {"id": 26, "title": "Everything Everywhere All at Once", "year": "2022", "genre": "Sci-Fi / Comedy", "desc": "A laundromat owner is pulled into the multiverse to save her family and the world."},
            {"id": 27, "title": "The Grand Budapest Hotel", "year": "2014", "genre": "Comedy / Adventure", "desc": "A legendary concierge and his lobby boy get caught up in a theft and a family fortune."},
            {"id": 28, "title": "Get Out", "year": "2017", "genre": "Horror / Thriller", "desc": "A young man visiting his girlfriend's family discovers a disturbing secret."},
            {"id": 29, "title": "The Silence of the Lambs", "year": "1991", "genre": "Thriller / Crime", "desc": "A young FBI trainee seeks help from an imprisoned killer to catch another."},
            {"id": 30, "title": "Se7en", "year": "1995", "genre": "Crime / Thriller", "desc": "Two detectives hunt a serial killer who uses the seven deadly sins as his guide."},
            {"id": 31, "title": "Back to the Future", "year": "1985", "genre": "Sci-Fi / Comedy", "desc": "A teenager is sent back to 1955 in a time-travelling car."},
            {"id": 32, "title": "Jurassic Park", "year": "1993", "genre": "Sci-Fi / Adventure", "desc": "A theme park of cloned dinosaurs turns dangerous."},
            {"id": 33, "title": "Titanic", "year": "1997", "genre": "Romance / Drama", "desc": "A romance between two passengers aboard the doomed ocean liner."},
            {"id": 34, "title": "The Prestige", "year": "2006", "genre": "Mystery / Drama", "desc": "Two rival magicians in Victorian London compete to create the ultimate illusion."},
            {"id": 35, "title": "Coco", "year": "2017", "genre": "Animation / Family", "desc": "A boy enters the Land of the Dead to learn about his family's history."},
            {"id": 36, "title": "Knives Out", "year": "2019", "genre": "Mystery / Comedy", "desc": "A detective investigates the death of a wealthy crime novelist."},
            {"id": 37, "title": "Django Unchained", "year": "2012", "genre": "Western / Drama", "desc": "A freed slave and a bounty hunter set out to rescue his wife."},
            {"id": 38, "title": "1917", "year": "2019", "genre": "War / Drama", "desc": "Two soldiers race across enemy territory to deliver a message that could save 1,600 men."},
            {"id": 39, "title": "Dunkirk", "year": "2017", "genre": "War / Thriller", "desc": "The evacuation of Allied soldiers from the beaches of Dunkirk."},
            {"id": 40, "title": "The Social Network", "year": "2010", "genre": "Drama / Biography", "desc": "The founding of Facebook and the legal fight that followed."},
            {"id": 41, "title": "Gravity", "year": "2013", "genre": "Sci-Fi / Thriller", "desc": "Two astronauts struggle to survive after their shuttle is destroyed."},
            {"id": 42, "title": "Pan's Labyrinth", "year": "2006", "genre": "Fantasy / Drama", "desc": "In 1944 Spain, a girl discovers a fantastical underworld."},
            {"id": 43, "title": "Amélie", "year": "2001", "genre": "Romance / Comedy", "desc": "A shy Parisian waitress secretly improves the lives of those around her."},
            {"id": 44, "title": "Ratatouille", "year": "2007", "genre": "Animation / Family", "desc": "A rat with a talent for cooking helps a young chef in Paris."},
            {"id": 45, "title": "Black Panther", "year": "2018", "genre": "Action / Adventure", "desc": "T'Challa returns to Wakanda to take the throne and faces a challenger."},
        ];

        // ---- Online πηγή ταινιών: TMDB (themoviedb.org) ----
        // Βάλε εδώ το δωρεάν API key σου (v3) από https://www.themoviedb.org/settings/api
        // Όσο είναι κενό, ή αν η TMDB δεν απαντά, χρησιμοποιείται η ενσωματωμένη λίστα.
        // Προσοχή: το κλειδί φαίνεται σε όποιον ανοίξει τον κώδικα της σελίδας.
        const TMDB_API_KEY = '7e64fae300f6fe45dc5666f7a0d64946';
        const TMDB_MAX_PAGE = 20; // τυχαία σελίδα 1 έως 20 των δημοφιλών ταινιών

        const TMDB_GENRES = {
            28: 'Action', 12: 'Adventure', 16: 'Animation', 35: 'Comedy', 80: 'Crime', 99: 'Documentary',
            18: 'Drama', 10751: 'Family', 14: 'Fantasy', 36: 'History', 27: 'Horror', 10402: 'Music',
            9648: 'Mystery', 10749: 'Romance', 878: 'Sci-Fi', 10770: 'TV Movie', 53: 'Thriller',
            10752: 'War', 37: 'Western'
        };

        const ROUND_SIZE = 12;
        const seenIds = new Set();   // ταινίες που έχουν ήδη εμφανιστεί σε αυτή την επίσκεψη
        let usingTmdb = false;
        let roundToken = 0;          // αγνοεί απαντήσεις από παλιότερα αιτήματα
        let activeIndex = 0;
        let deckMovies = []; // οι ταινίες του τρέχοντος γύρου

        const GENRE_EMOJI = {
            'Sci-Fi': '🚀', 'Action': '💥', 'Crime': '🕵️', 'Drama': '🎭', 'Animation': '✨', 'Thriller': '🔍',
            'Comedy': '😄', 'Horror': '👻', 'Romance': '❤️', 'Musical': '🎵', 'Music': '🎵', 'War': '🪖',
            'Fantasy': '🧙', 'Western': '🤠', 'Mystery': '🔎', 'Biography': '📖', 'Adventure': '🧭', 'Family': '🏠'
        };

        function genreEmoji(movie) {
            const first = movie.genre.split(' / ')[0];
            return GENRE_EMOJI[first] || '🎬';
        }

        // Χρώμα "αφίσας" από τον τίτλο, ώστε κάθε ταινία να έχει σταθερό χρώμα
        function posterBg(movie) {
            let h = 0;
            for (const ch of movie.title) h = (h * 31 + ch.charCodeAt(0)) % 360;
            return `linear-gradient(150deg, hsl(${h}, 65%, 38%), hsl(${(h + 45) % 360}, 70%, 14%))`;
        }

        // Fisher-Yates shuffle
        function shuffled(list) {
            const a = list.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // Ταινίες από την ενσωματωμένη λίστα (εφεδρική πηγή)
        function pickLocalRound() {
            const saved = new Set(watchlist.map(m => String(m.id)));
            let pool = movieData.filter(m => !saved.has(String(m.id)) && !seenIds.has(String(m.id)));
            if (pool.length < ROUND_SIZE) {
                // τελείωσαν οι καινούριες: ξαναρχίζουμε τον κύκλο, πάντα χωρίς όσες έχεις σώσει
                seenIds.clear();
                pool = movieData.filter(m => !saved.has(String(m.id)));
            }
            return shuffled(pool).slice(0, ROUND_SIZE);
        }

        // Ταινίες από την TMDB: τυχαία σελίδα δημοφιλών ταινιών
        async function fetchTmdbRound() {
            const page = 1 + Math.floor(Math.random() * TMDB_MAX_PAGE);
            const url = 'https://api.themoviedb.org/3/movie/popular?api_key=' + encodeURIComponent(TMDB_API_KEY) +
                '&language=en-US&include_adult=false&page=' + page;
            const res = await fetch(url);
            if (!res.ok) throw new Error('TMDB status ' + res.status);
            const data = await res.json();
            if (!data || !Array.isArray(data.results)) throw new Error('TMDB bad response');

            const saved = new Set(watchlist.map(m => String(m.id)));
            const movies = data.results
                .filter(m => m.poster_path && m.overview)
                .map(m => ({
                    id: 'tmdb-' + m.id,
                    title: m.title,
                    year: (m.release_date || '').slice(0, 4) || '—',
                    genre: (m.genre_ids || []).map(g => TMDB_GENRES[g]).filter(Boolean).slice(0, 2).join(' / ') || 'Movie',
                    desc: m.overview,
                    poster: 'https://image.tmdb.org/t/p/w500' + m.poster_path
                }))
                .filter(m => !saved.has(m.id) && !seenIds.has(m.id));
            if (movies.length === 0) throw new Error('TMDB returned no new movies');
            return shuffled(movies).slice(0, ROUND_SIZE);
        }

        // Διαλέγει τον νέο γύρο: πρώτα online, αλλιώς η ενσωματωμένη λίστα
        async function pickRound() {
            if (TMDB_API_KEY) {
                try {
                    const movies = await fetchTmdbRound();
                    usingTmdb = true;
                    return movies;
                } catch (e) {
                    console.error('TMDB unavailable, using the built-in list:', e);
                }
            }
            usingTmdb = false;
            return pickLocalRound();
        }

        // Escape για κείμενο που έρχεται από το internet
        function esc(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Αφίσα: πραγματική εικόνα όταν υπάρχει, αλλιώς χρώμα και emoji
        function posterHtml(movie, sizeClasses) {
            const fallback = `<div class="absolute inset-0 flex justify-center ${sizeClasses}" style="background:${posterBg(movie)}" aria-hidden="true">${genreEmoji(movie)}</div>`;
            if (!movie.poster) return fallback;
            return fallback + `<img src="${esc(movie.poster)}" alt="" loading="lazy" onerror="this.remove()" class="absolute inset-0 w-full h-full object-cover pointer-events-none">`;
        }
        // Η watchlist αποθηκεύεται στο κινητό ώστε να μένει μετά από ανανέωση της σελίδας
        const WATCHLIST_KEY = 'movie-swiper-watchlist';

        function loadWatchlist() {
            try {
                const saved = JSON.parse(localStorage.getItem(WATCHLIST_KEY));
                if (!Array.isArray(saved)) return [];
                return saved.map(item => {
                    // παλιά μορφή: μόνο αριθμός id της ενσωματωμένης λίστας
                    if (typeof item === 'number') return movieData.find(m => m.id === item);
                    // νέα μορφή: ολόκληρη η ταινία
                    return item && item.id && item.title ? item : null;
                }).filter(Boolean);
            } catch (e) {
                return [];
            }
        }

        function saveWatchlist() {
            try {
                localStorage.setItem(WATCHLIST_KEY, JSON.stringify(watchlist));
            } catch (e) { /* χωρίς αποθήκευση σε ιδιωτική περιήγηση */ }
        }

        let watchlist = loadWatchlist();
        let isDragging = false;
        let startX = 0;
        let currentX = 0;
        let currentCard = null;

        const deck = document.getElementById('deck');

        async function initDeck() {
            // Καθαρισμός deck (κρατάμε μόνο τα "no-more-cards" και "deck-status")
            const cards = deck.querySelectorAll('.movie-card');
            cards.forEach(c => c.remove());
            document.getElementById('no-more-cards').classList.add('hidden');
            currentCard = null;
            deckMovies = [];
            activeIndex = 0;

            const token = ++roundToken;
            const status = document.getElementById('deck-status');
            status.classList.remove('hidden');
            const movies = await pickRound();
            if (token !== roundToken) return; // ξεκίνησε νεότερο αίτημα
            status.classList.add('hidden');

            deckMovies = movies;
            deckMovies.forEach(m => seenIds.add(String(m.id)));
            updateSourceNote();

            // Δημιουργία καρτών από το τέλος προς την αρχή (για να εμφανίζεται η πρώτη πάνω-πάνω)
            for (let i = deckMovies.length - 1; i >= 0; i--) {
                const movie = deckMovies[i];
                const card = document.createElement('div');
                card.className = "movie-card";
                card.dataset.id = String(movie.id);
                
                card.innerHTML = `
                    ${posterHtml(movie, 'items-start pt-[12%] text-7xl')}
                    <div class="card-overlay absolute inset-0 p-6 flex flex-col justify-end">
                        <div class="flex justify-between items-end mb-2">
                            <span class="bg-violet-600 text-xs px-2 py-1 rounded-md font-bold">${esc(movie.genre)}</span>
                        </div>
                        <h2 class="text-2xl font-black">${esc(movie.title)} <span class="text-sm font-normal text-slate-400">(${esc(movie.year)})</span></h2>
                        <p class="text-xs text-slate-300 mt-2 line-clamp-3">${esc(movie.desc)}</p>
                    </div>
                `;
                
                // Event Listeners για Dragging (Mouse & Touch)
                card.addEventListener('mousedown', dragStart);
                card.addEventListener('touchstart', dragStart, { passive: true });
                
                deck.appendChild(card);
            }
            
            activeIndex = 0;
            updateCardStack();
        }

        // Ένδειξη πηγής. Η TMDB ζητά αναφορά όταν χρησιμοποιείται το API της.
        function updateSourceNote() {
            const note = document.getElementById('source-note');
            note.textContent = usingTmdb
                ? 'This product uses the TMDB API but is not endorsed or certified by TMDB.'
                : 'Showing the built-in movie list.';
        }

        function updateCardStack() {
            const cards = deck.querySelectorAll('.movie-card');
            cards.forEach((card, i) => {
                // Ανάποδο index (η πάνω κάρτα είναι η τελευταία στο DOM)
                const revIndex = cards.length - 1 - i;
                
                if (revIndex === activeIndex) {
                    card.style.transform = `translate3d(0, 0, 0) scale(1)`;
                    card.style.opacity = 1;
                    card.style.pointerEvents = 'auto';
                    currentCard = card;
                } else if (revIndex === activeIndex + 1) {
                    card.style.transform = `translate3d(0, 15px, -20px) scale(0.95)`;
                    card.style.opacity = 0.8;
                    card.style.pointerEvents = 'none';
                } else if (revIndex === activeIndex + 2) {
                    card.style.transform = `translate3d(0, 30px, -40px) scale(0.9)`;
                    card.style.opacity = 0.5;
                    card.style.pointerEvents = 'none';
                } else {
                    card.style.opacity = 0;
                    card.style.pointerEvents = 'none';
                }
            });

            if (activeIndex >= deckMovies.length) {
                document.getElementById('no-more-cards').classList.remove('hidden');
                currentCard = null;
            }
        }

        // Drag Handlers
        let lastTouchTime = 0;

        function dragStart(e) {
            if (isDragging || !currentCard) return;
            if (e.type === 'touchstart') {
                lastTouchTime = Date.now();
            } else if (Date.now() - lastTouchTime < 700) {
                return; // mouse event που προκαλεί ο browser μετά από touch
            }
            isDragging = true;

            startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            currentX = startX; // χωρίς αυτό ένα απλό πάτημα μετρούσε ως μεγάλο swipe
            currentCard.style.transition = 'none';

            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchmove', dragMove, { passive: false });
            document.addEventListener('touchend', dragEnd);
            document.addEventListener('touchcancel', dragEnd);
        }

        function dragMove(e) {
            if (!isDragging) return;
            
            currentX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const deltaX = currentX - startX;
            const rotate = deltaX * 0.08; // Ελαφρύ στρίψιμο της κάρτας

            currentCard.style.transform = `translate3d(${deltaX}px, 0, 0) rotate(${rotate}deg)`;

            // Οπτική ένδειξη Like/Dislike (πράσινο ή κόκκινο overlay ανάλογα με το drag)
            if (deltaX > 50) {
                currentCard.style.borderColor = 'rgba(74, 222, 128, 0.5)';
            } else if (deltaX < -50) {
                currentCard.style.borderColor = 'rgba(248, 113, 113, 0.5)';
            } else {
                currentCard.style.borderColor = 'rgba(255, 255, 255, 0.1)';
            }
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;

            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
            document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('touchend', dragEnd);
            document.removeEventListener('touchcancel', dragEnd);

            const deltaX = currentX - startX;
            const threshold = Math.min(120, window.innerWidth * 0.25); // Απόσταση που θεωρείται Swipe

            currentCard.style.transition = 'transform 0.3s ease, opacity 0.3s';

            if (deltaX > threshold) {
                swipe('right');
            } else if (deltaX < -threshold) {
                swipe('left');
            } else {
                // Επαναφορά στο κέντρο αν δεν ξεπέρασε το όριο
                currentCard.style.transform = `translate3d(0, 0, 0) rotate(0deg)`;
                currentCard.style.borderColor = 'rgba(255, 255, 255, 0.1)';
            }
            
            startX = 0;
            currentX = 0;
        }

        function swipe(direction) {
            const flyOutX = direction === 'right' ? 500 : -500;
            const rotate = direction === 'right' ? 30 : -30;
            
            currentCard.style.transform = `translate3d(${flyOutX}px, 0, 0) rotate(${rotate}deg)`;
            currentCard.style.opacity = 0;

            const movie = deckMovies[activeIndex];
            if (direction === 'right') {
                addToWatchlist(movie);
            }

            activeIndex++;
            
            // Περιμένουμε να τελειώσει το animation πριν ανανεώσουμε τη στοίβα
            setTimeout(() => {
                updateCardStack();
            }, 200);
        }

        // Swipe μέσω των κουμπιών στο κάτω μέρος
        function swipeButton(direction) {
            if (!currentCard) return;
            currentCard.style.transition = 'transform 0.4s ease, opacity 0.4s';
            swipe(direction);
        }

        // Watchlist Logic
        function addToWatchlist(movie) {
            if (movie && !watchlist.some(m => String(m.id) === String(movie.id))) {
                watchlist.push(movie);
                saveWatchlist();
            }
            updateWatchlistUI();
        }

        function updateWatchlistUI() {
            document.getElementById('match-count').textContent = watchlist.length;
            const list = document.getElementById('matches-list');
            
            if (watchlist.length === 0) {
                list.innerHTML = `<li class="italic text-slate-500">No movies saved yet...</li>`;
                return;
            }

            list.innerHTML = watchlist.map(movie => `
                <li class="flex items-center gap-2 bg-slate-900 p-2 rounded border border-slate-800">
                    <div class="relative w-10 h-10 rounded overflow-hidden shrink-0 text-lg">${posterHtml(movie, 'items-center text-lg')}</div>
                    <div class="flex-grow">
                        <p class="font-bold text-xs">${esc(movie.title)}</p>
                        <p class="text-[10px] text-slate-400">${esc(movie.genre)}</p>
                    </div>
                    <button onclick="removeFromWatchlist('${esc(movie.id)}')" aria-label="Remove ${esc(movie.title)}" class="text-red-500 hover:text-red-400 text-sm w-11 h-11 shrink-0">✖</button>
                </li>
            `).join('');
        }

        function removeFromWatchlist(id) {
            watchlist = watchlist.filter(m => String(m.id) !== String(id));
            saveWatchlist();
            updateWatchlistUI();
        }

        function toggleMatches() {
            const panel = document.getElementById('matches-panel');
            panel.classList.toggle('scale-0');
            panel.classList.toggle('scale-100');
        }

        // Νέος γύρος με άλλες τυχαίες ταινίες. Η watchlist μένει.
        function resetDeck() {
            initDeck();
        }

        // Εκκίνηση
        window.onload = () => {
            updateWatchlistUI();
            initDeck();
        };
    </script>
</body>
</html>
